<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="profilecard.css">
</head>

<body>
    <div class="main">
        <div class="container">
            <div class="card">
                <div class="image">
                    <img src="back.png" alt="" height="150px" width="250px"
                        style="border-radius: 20px;overflow: hidden;">
                    <div id="profilepic">
                        <div class="back">
                            <img src="me1.png" alt="Profile Picture" width="80" height="80" style="border-radius: 50%;">
                        </div>
                    </div>
                    <div id="back">
                        <div class="box"><button type="button" class="plus">+</button>
                        </div>

                        <div class="info">
                            <h2 id="name">Harin Desrawala</h2>
                            <pre id="selfinfo">Product Designer who focuses on
simplicity & usability.</pre>
                            <div class="stats">
                                <div class="stat1">
                                    <h2 id="stathead">72.9k</h2>
                                    <h5 id="statstat">Likes</h5>
                                </div>
                                <div class="stat1">
                                    <h2 id="stathead">828</h2>
                                    <h5 id="statstat">Posts</h5>
                                </div>
                                <div class="stat1">
                                    <h2 id="stathead">342.9k</h2>
                                    <h5 id="statstat">Views</h5>
                                </div>
                            </div>
                            <div class="social">
                                <img src="https://img.icons8.com/?size=100&id=32320&format=png&color=000000" alt="" height="40px">
                                <img src="https://img.icons8.com/?size=100&id=YfCbGWCWcuar&format=png&color=000000" alt="" height="32px" style="margin-top: 4px;">
                                <img src="https://img.icons8.com/?size=100&id=ikThuZ5WmSYz&format=png&color=000000" alt="" height="40px">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
</body>

</html>
